<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dig Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root { --umber: #1a130e; --bone: #efe3c8; --ink: #2a1d12; --rust: #d0612f; --dim: #a8987b; --serif: 'DM Serif Display', Georgia, serif; --mono: 'Courier Prime', 'Courier New', monospace; }
* { box-sizing: border-box; margin: 0; }
html { scroll-padding-top: 12px; }
body { background: var(--umber); color: var(--bone); font: 400 15px/1.5 var(--mono); }
header, main, footer { width: min(1100px, 100%); margin-inline: auto; padding-inline: 20px; }
header { padding-top: 48px; padding-bottom: 28px; }
h1 { font: 400 clamp(44px, 9vw, 96px)/.92 var(--serif); letter-spacing: -.01em; }
h1 em { color: var(--rust); }
.lede { margin-top: 14px; color: var(--dim); max-width: 60ch; }
.stats { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 28px; }
.stats b { display: block; font: 400 30px/1 var(--serif); color: var(--bone); }
.stats span { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
.hint { margin-top: 18px; color: var(--dim); font-size: 13px; }
main { position: relative; padding-inline: 0; }
canvas { display: block; width: 100%; cursor: crosshair; }
#gauge { position: fixed; right: 10px; top: 50%; translate: 0 -50%; display: grid; gap: 4px; z-index: 5; }
#gauge button { font: 400 12px/1 var(--mono); color: var(--bone); background: rgba(26,19,14,.82); border: 1px solid rgba(239,227,200,.25); padding: 8px 10px; min-height: 36px; text-align: right; cursor: pointer; display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
#gauge button i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#gauge button[aria-current="true"] { border-color: var(--rust); color: #fff; }
#gauge button:focus-visible, summary:focus-visible, .again:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
#card { position: fixed; z-index: 10; pointer-events: none; width: min(300px, 80vw); background: var(--bone); color: var(--ink); padding: 12px 14px; border: 1px solid #00000040; box-shadow: 4px 6px 0 rgba(0,0,0,.35); transform: rotate(-1.2deg); display: none; font-size: 13px; }
#card h3 { font: 400 20px/1.1 var(--serif); overflow-wrap: anywhere; }
#card dl { margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
#card dt { color: #6a5640; text-transform: uppercase; font-size: 11px; letter-spacing: .1em; }
#card dd { overflow-wrap: anywhere; }
#card .stamp { margin-top: 8px; color: var(--rust); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 11px; }
footer { padding-block: 36px 70px; }
.carbon { background: var(--bone); color: var(--ink); padding: 22px 24px; transform: rotate(-.6deg); box-shadow: 6px 8px 0 rgba(0,0,0,.4); }
.carbon h2 { font: 400 clamp(26px, 4vw, 40px)/1.05 var(--serif); }
.carbon p { margin-top: 8px; }
details { margin-top: 28px; }
summary { cursor: pointer; color: var(--bone); padding: 8px 0; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
caption { text-align: left; color: var(--dim); padding: 8px 0; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid rgba(239,227,200,.15); overflow-wrap: anywhere; }
th { color: var(--dim); font-weight: 400; text-transform: uppercase; font-size: 11px; letter-spacing: .1em; }
.tables { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.note { margin-top: 30px; color: var(--dim); font-size: 12px; }
@media (max-width: 700px) { #gauge button { min-height: 44px; min-width: 44px; } #gauge button span { display: none; } #gauge { right: 6px; } header { padding-top: 28px; } }
</style>
</head>
<body>
<header>
  <h1>Dig <em>Site</em></h1>
  <p class="lede" id="lede"></p>
  <div class="stats" id="stats"></div>
  <p class="hint">Scroll to dig down through time. Hover a fossil to read its label. Click one to copy its path.</p>
</header>
<nav id="gauge" aria-label="Jump to a layer"></nav>
<main><canvas id="dig" role="img" aria-label="Cross-section of the folder: files drawn as fossils in rock layers by age. The full list is in the ledger below."></canvas></main>
<div id="card" role="status"></div>
<footer>
  <section class="carbon" id="carbon"></section>
  <details>
    <summary>Open the ledger (plain-text list of the oldest and biggest files)</summary>
    <div class="tables" id="ledger"></div>
  </details>
  <p class="note" id="note"></p>
</footer>
<!--SCRIPT-->
</body>
</html>
